<title id="title">Luồng tra cứu và đọc báo cáo thần số học</title><desc id="desc">Nhập thông tin, kiểm tra, tính toán, xem tổng quan và chọn các phần báo cáo. Lỗi quay về nhập liệu; thiếu dữ liệu báo cáo yêu cầu nhập lại.</desc>
