<g fill="#f5f0ff" font-family="Arial,sans-serif" font-size="19" text-anchor="middle"><text x="600" y="119">P01 · Họ tên + ngày sinh</text><text x="600" y="227">Hợp lệ?</text><text x="190" y="228">Báo lỗi tại trường · sửa lại</text><text x="600" y="350">Tính toán → lưu Redux</text><text x="600" y="465">P02 · Tổng quan báo cáo</text><text x="1015" y="338">Mở báo cáo trực tiếp</text><text x="1015" y="361">khi chưa có dữ liệu</text><text x="1015" y="465">Yêu cầu nhập thông tin</text><text x="165" y="611">P03 · Các chỉ số</text><text x="165" y="640">Đọc diễn giải</text><text x="455" y="611">P04 · Biểu đồ</text><text x="455" y="640">Ngày sinh / tên / tổng hợp</text><text x="745" y="611">P05 · Giai đoạn</text><text x="745" y="640">Đỉnh cao &amp; thử thách</text><text x="1035" y="611">P06 · Tổng kết</text><text x="1035" y="640">Đọc lại toàn cảnh</text></g>
